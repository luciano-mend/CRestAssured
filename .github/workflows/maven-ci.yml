name: Pipeline de Testes de API - Rest Assured & Java 21

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Execução Automatizada da Suíte de Testes
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (JDK Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Executar Testes Automatizados (Surefire)
        run: mvn clean test --batch-mode

      - name: 4. Publicar Relatório de Testes (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-surefire
          path: target/surefire-reports/

      - name: 5. Carregar Histórico do Allure Report da branch gh-pages
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          continue-on-error: true

      - name: 6. Gerar Relatório HTML do Allure com Histórico
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: 7. Publicar Relatório Allure no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
